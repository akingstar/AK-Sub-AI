name: Deploy AK Sub-AI Model Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worker-proxy/**'
      - '.github/workflows/deploy-worker-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: worker-proxy
        run: npm install

      - name: Configure Turnstile secret
        working-directory: worker-proxy
        run: |
          test -n "$TURNSTILE_SECRET" || { echo "Missing TURNSTILE_SECRET GitHub secret"; exit 1; }
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}

      - name: Deploy Worker
        working-directory: worker-proxy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
