name: Test IndicXlit Hindi Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-indicxlit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout AK-Sub-AI
        uses: actions/checkout@v4

      - name: Checkout official IndicXlit source
        uses: actions/checkout@v4
        with:
          repository: AI4Bharat/IndicXlit
          ref: v1.0
          path: indicxlit-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install compatible CPU dependencies
        run: |
          python -m pip install "pip<24.1" "setuptools<60" wheel
          python -m pip install numpy==1.23.5
          python -m pip install torch==1.13.1+cpu torchaudio==0.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install Cython==0.29.36 PyYAML==6.0.1 omegaconf==2.0.6 hydra-core==1.0.7
          python -m pip install pydload tqdm ninja
          python -m pip install --no-build-isolation "git+https://github.com/facebookresearch/fairseq.git@v0.12.2"

      - name: Prepare official IndicXlit model
        run: |
          MODEL_ROOT="indicxlit-source/app/ai4bharat/transliteration/transformer/models"
          MODEL_DIR="$MODEL_ROOT/v1.0"
          mkdir -p "$MODEL_DIR"
          test -f "$MODEL_ROOT/lang_list.txt"

          curl -fL --retry 3 \
            "https://github.com/akingstar/AK-Sub-AI/releases/download/v1.0-nllb/indicxlit-en-indic-v1.0.zip" \
            -o "$RUNNER_TEMP/indicxlit-en-indic-v1.0.zip"

          unzip -q "$RUNNER_TEMP/indicxlit-en-indic-v1.0.zip" -d "$MODEL_DIR"

          test -f "$MODEL_DIR/transformer/indicxlit.pt"
          test -f "$MODEL_DIR/corpus-bin/dict.en.txt"
          echo "Official IndicXlit model verified."

      - name: Restore Hindi rescoring dictionary cache
        uses: actions/cache@v4
        with:
          path: indicxlit-source/app/ai4bharat/transliteration/transformer/models/v1.0/word_prob_dicts
          key: indicxlit-hi-word-dictionaries-v1

      - name: Test Hindi transliteration with rescoring
        env:
          PYTHONPATH: indicxlit-source/app
        run: |
          python - <<'PY'
          import re
          from ai4bharat.transliteration import XlitEngine

          print("Loading IndicXlit with Hindi rescoring enabled...")
          engine = XlitEngine(
              lang2use="hi",
              beam_width=10,
              rescore=True
          )

          word_cache = {}

          def get_candidates(word):
              key = word.lower()
              if key not in word_cache:
                  result = engine.translit_word(
                      key,
                      lang_code="hi",
                      topk=10
                  )
                  if not isinstance(result, list) or not result:
                      raise RuntimeError(
                          f"No transliteration candidates for: {key}"
                      )
                  word_cache[key] = result
              return word_cache[key]

          def transliterate_sentence(text):
              def replace_word(match):
                  candidates = get_candidates(match.group(0))
                  return candidates[0]
              return re.sub(r"[A-Za-z]+", replace_word, text)

          samples = [
              "mera naam akshay hai",
              "aap kaise ho",
              "mujhe ghar jana hai",
              "kal milte hain",
              "namaste bhai",
              "hum kal milte hain",
              "aaj mausam bahut accha hai",
              "mujhe aapse baat karni hai",
              "kripya mujhe bataiye",
              "yeh mera phone hai",
              "main ghar par hoon",
              "aapka naam kya hai",
              "dhanyavaad bhai",
              "mujhe pani chahiye",
              "tum kahan ja rahe ho",
              "main theek hoon",
              "mujhe samajh nahi aaya",
              "bahut accha laga",
              "kal subah milte hain",
              "ghar par sab theek hai",
              "mujhe aapse madad chahiye",
              "please mujhe call karna",
              "mera phone kahan hai",
              "aap yahan kab aaye",
              "main abhi vyast hoon"
          ]

          print("\n===== RESCORED HINDI RESULTS =====")
          for text in samples:
              output = transliterate_sentence(text)
              print(f"INPUT : {text}")
              print(f"OUTPUT: {output}")
              print("-" * 45)

          debug_words = [
              "milte", "accha", "kripya", "bataiye",
              "yeh", "main", "kal", "bahut", "hoon"
          ]

          print("\n===== TOP CANDIDATES FOR TROUBLE WORDS =====")
          for word in debug_words:
              print(f"{word}: {get_candidates(word)[:10]}")

          print("\n===== TEST SUMMARY =====")
          print(f"Sentences tested: {len(samples)}")
          print(f"Unique words processed: {len(word_cache)}")
          print("Rescoring enabled: True")
          print("Beam width: 10")
          print("Candidates per word: 10")
          PY
